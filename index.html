<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مساعد شحوم للرياضيات</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1e3a8a;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 16px;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .chat-box {
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    #messages {
      height: 430px;
      overflow-y: auto;
      padding: 20px;
      background: #fafafa;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .user {
      background: #1e3a8a;
      color: white;
      margin-right: 0;
      margin-left: auto;
    }

    .assistant {
      background: #e8eefc;
      color: #222;
      margin-right: auto;
      margin-left: 0;
    }

    .welcome {
      text-align: center;
      color: #666;
      padding: 40px 10px;
      line-height: 2;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #eee;
      background: white;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }

    button {
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #152c6b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      #messages {
        height: 380px;
      }

      .input-area {
        padding: 10px;
      }

      button {
        padding: 10px 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🧮 مساعد شحوم للرياضيات</h1>
    <p>مساعد ذكي لمساعدتك في حل مسائل الرياضيات</p>
  </header>

  <main class="container">
    <div class="chat-box">

      <div id="messages">
        <div class="welcome">
          <strong>مرحبًا بك 👋</strong>
          <br>
          أنا مساعد شحوم للرياضيات.
          <br>
          اكتب سؤالك أو المسألة الرياضية وسأساعدك في الحل.
        </div>
      </div>

      <div class="input-area">
        <input
          id="messageInput"
          type="text"
          placeholder="اكتب سؤالك في الرياضيات..."
          autocomplete="off"
        >

        <button id="sendButton">
          إرسال
        </button>
      </div>

    </div>
  </main>

  <script>
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const button = document.getElementById("sendButton");

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function addMessage(text, sender) {
      const message = document.createElement("div");

      message.className = "message " + sender;
      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) {
        return;
      }

      const welcome = document.querySelector(".welcome");

      if (welcome) {
        welcome.remove();
      }

      addMessage(text, "user");

      input.value = "";
      input.disabled = true;
      button.disabled = true;
      button.textContent = "جاري التفكير...";

      try {
        const response = await fetch("/api/assistant/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            siteContent: ""
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "حدث خطأ أثناء الاتصال بالمساعد."
          );
        }

        addMessage(
          data.reply || data.message || "لم يتم استلام رد من المساعد.",
          "assistant"
        );

      } catch (error) {
        addMessage(
          "حدث خطأ أثناء الاتصال بالمساعد: " + error.message,
          "assistant"
        );

      } finally {
        input.disabled = false;
        button.disabled = false;
        button.textContent = "إرسال";
        input.focus();
      }
    }
  </script>

</body>
</html>
